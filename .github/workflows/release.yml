name: release

# Pushing a tag like v1.2.3 publishes ghcr.io/alicona1/tuxedo-weather:1.2.3
# and :latest for amd64 and arm64, then creates the GitHub release. Running
# it by hand (workflow_dispatch) does everything except publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test emulator/firmware.test.mjs

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The panel needs the literal "HTTP/1.1 200 OK", and the server must stop
      # cleanly on SIGTERM. Check both on the real image before publishing.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tuxedo-weather:smoke
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 10086:10086 tuxedo-weather:smoke
          for i in $(seq 30); do
            status=$(printf 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' | nc -w 2 localhost 10086 | head -1 | tr -d '\r') || true
            [ "$status" = "HTTP/1.1 200 OK" ] && break
            sleep 1
          done
          echo "status line: $status"
          [ "$status" = "HTTP/1.1 200 OK" ]
          start=$(date +%s); docker stop smoke >/dev/null; took=$(( $(date +%s) - start ))
          code=$(docker inspect smoke --format '{{.State.ExitCode}}')
          echo "docker stop took ${took}s, exit code $code"
          [ "$code" = 0 ] && [ "$took" -lt 5 ]

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PUBLISH }}
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\` (also \`:latest\`), for amd64 and arm64."
